# Keeps the free Supabase project awake: free projects pause after 7 days without activity,
# and this app is mostly used around month-end. Twice a week it reads one small table.
#
# Setup (once): add the session-pooler URL from .env.local as a repository secret:
#   gh secret set DIRECT_URL
# Scheduled runs only happen from the default branch (main). Run it by hand from the
# Actions tab → Keep Supabase awake → Run workflow.
#
# If the project is already paused, the query fails and GitHub emails you about the failed
# run — a heads-up to click "Restore project" in the Supabase dashboard.

name: Keep Supabase awake

on:
  schedule:
    # Mondays and Thursdays, 01:00 UTC = 09:00 Manila.
    - cron: "0 1 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read from the database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::The DIRECT_URL secret isn't set. Run: gh secret set DIRECT_URL"
            exit 1
          fi
          # Output is discarded: this repo is public, so the logs are too.
          psql "$DIRECT_URL" -qtAc "select count(*) from members" > /dev/null
          echo "Database reached."
