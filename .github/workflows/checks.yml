# Runs the pre-PR checks on every pull request and every push to main, so a broken type,
# lint error or failing test shows up as a red ✗ on the PR instead of relying on memory.
#
# No secrets needed: the tests never touch the database (docs/testing.md). Keep it that way —
# this repo is public, and so are its Actions logs.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0" # no git hooks on the CI machine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The production build, so a page that only breaks when built shows up here, not first on
      # Vercel after merging. Placeholders, not secrets: every page needs a login, so the build
      # never connects to anything (the database client only connects on its first query).
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
